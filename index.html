<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Pet</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <section id="pet-interaction">
            <h2>Interact with Your Pet</h2>
            <label for="pet-selector">Choose your pet:</label>
            <select id="pet-selector">
                <option value="" disabled selected>Select a pet</option>
                <option value="pet1">Simiang</option>
                <option value="pet2">Pet 2</option>
            </select>
            <img id="pet-image" src="images/download.jpg" alt="Your Virtual Pet" style="width: 200px; height: auto;">
            <div>
                <button id="feed-button">Feed</button>
                <button id="pet-button">Pet</button>
            </div>
            <p id="pet-status">Your pet is waiting for you!</p>
            <audio id="feed-sound" src="feed-sound1.mp3"></audio>
            <audio id="pet-sound" src="pet-sound1.mp3"></audio>
        </section>
    </main>
    <script>
        const petSelector = document.getElementById('pet-selector');
        const petImage = document.getElementById('pet-image');
        const feedSound = document.getElementById('feed-sound');
        const petSound = document.getElementById('pet-sound');

        petSelector.addEventListener('change', () => {
            if (petSelector.value === 'pet1') {
                petImage.src = 'images/simaing.jpg';
                petImage.alt = 'Simiang';
                feedSound.src = 'feed-sound1.mp3';
                petSound.src = 'pet-sound1.mp3';
            } else if (petSelector.value === 'pet2') {
                petImage.src = 'pet2.png';
                petImage.alt = 'Your Virtual Pet 2';
                feedSound.src = 'feed-sound2.mp3';
                petSound.src = 'pet-sound2.mp3';
            }
        });
    </script>
    <script>
        feedButton.addEventListener('click', () => {
            feedSound.play();
        });

        petButton.addEventListener('click', () => {
            petSound.play();
        });
    </script>
    <script>
        const petStatus = document.getElementById('pet-status');
        const feedButton = document.getElementById('feed-button');
        const petButton = document.getElementById('pet-button');

        feedButton.addEventListener('click', () => {
            petStatus.textContent = "You fed your pet! It looks happy!";
        });

        petButton.addEventListener('click', () => {
            petStatus.textContent = "You petted your pet! It feels loved!";
        });
    </script>
    <footer>
        <p>&copy; <span id="year"></span> Virtual Pet. All rights reserved.</p>
    </footer>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
